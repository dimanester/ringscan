# Keeps the SHA-pinned GitHub Actions current: Dependabot updates each pin
# together with its "# vX.Y.Z" comment. One grouped pull request a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
