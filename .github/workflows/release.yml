# Publishes a GitHub Release when a version tag (v0.1.0, ...) is pushed:
# builds the Windows exe exactly like CI, checks it, attests its build
# provenance and attaches RingScan.exe + RingScan.exe.sha256 to the release.
#
# Jobs, each with only the permissions it needs:
#   preflight  the tagged commit is on main, CI passed on it, and the
#              release does not exist yet (runs no repository code)
#   build      clean build from the tag, without the CI cache (read-only)
#   attest     signs the provenance of the built exe (runs no repository
#              code, so build scripts never hold the signing permissions)
#   publish    creates the release (runs no repository code)
#
# Push the tag only after CI is green on that main commit. Context values
# such as the tag name reach the scripts only through env.
#
# Runbook: a run that fails in publish leaves an attestation for an exe that
# was never released, and a failed upload can leave a draft release behind.
# Delete the release or draft (gh release delete TAG) before re-running.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  WIN_TARGET: x86_64-pc-windows-gnu

jobs:
  preflight:
    name: Check the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare commits, list releases
      actions: read # look up the CI runs of the commit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: The commit is on main
        run: |
          status="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          echo "$GITHUB_SHA compared with main: $status"
          case "$status" in
            identical | behind) ;;
            *)
              echo "::error::$TAG points to $GITHUB_SHA, which is not on main ($status)"
              exit 1
              ;;
          esac

      - name: CI passed on the commit
        run: |
          runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" \
            --jq .total_count)"
          echo "successful CI runs of $GITHUB_SHA on main: $runs"
          if [ "$runs" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA on main. Wait for CI to pass, then re-run this workflow."
            exit 1
          fi

      # Drafts are visible only to the publish job's token, which checks
      # again; this catches re-runs before anything is built or attested.
      - name: The release does not exist yet
        run: |
          existing="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .html_url')"
          if [ -n "$existing" ]; then
            echo "::error::A release for $TAG already exists: $existing"
            exit 1
          fi

  build:
    name: Build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -vV

      - name: Check the tag against the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ringscan") | .version')"
          echo "tag: $TAG, workspace version: $version"
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the workspace version '$version' (expected v$version)"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p notes
          bash scripts/release-notes.sh "${TAG#v}" > notes/release-notes.md
          cat notes/release-notes.md

      - name: Build the release exe
        run: cargo build --release --locked --target "$WIN_TARGET" -p ringscan

      - name: Check that it imports only system DLLs
        run: bash scripts/check-exe-imports.sh "target/$WIN_TARGET/release/ringscan.exe"

      - name: Stage the release files
        run: |
          mkdir -p dist
          cp "target/$WIN_TARGET/release/ringscan.exe" dist/RingScan.exe
          cd dist
          sha256sum RingScan.exe > RingScan.exe.sha256
          sha256sum --check RingScan.exe.sha256
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check the exe against its SHA-256 file
        run: cd release/dist && sha256sum --check RingScan.exe.sha256

      # The subject name is the file name, RingScan.exe, as published.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/dist/RingScan.exe

  publish:
    name: Create the GitHub Release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          ls -lR
          (cd dist && sha256sum --check RingScan.exe.sha256)
          # With write access the listing includes drafts, e.g. one left
          # behind by a failed upload.
          existing="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.html_url) (draft: \(.draft))"')"
          if [ -n "$existing" ]; then
            echo "::error::A release for $TAG already exists: $existing. Delete it before re-running."
            exit 1
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/RingScan.exe dist/RingScan.exe.sha256 \
            --verify-tag \
            --title "RingScan $TAG" \
            --notes-file notes/release-notes.md \
            "${prerelease[@]}"
