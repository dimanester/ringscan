[workspace]
resolver = "3"
members = ["crates/core", "crates/ntfs", "crates/win", "crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dmytro Nesterenko"]
repository = "https://github.com/dimanester/ringscan"
# Internal crates of one application, not meant for crates.io.
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
